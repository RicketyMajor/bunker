services:
  # El contenedor de la base de datos
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=library_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?falta en .env}
    # 127.0.0.1 on purpose: on 0.0.0.0 anyone on the LAN or the tailnet opened the whole
    # database as admin, bypassing Django entirely. Nothing in the code uses this port
    # (grep 5436 = 0 hits); it is published only for a manual psql from the host.
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d library_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # El contenedor aplicación Django / CLI
  web:
    build: .
    restart: unless-stopped
    # Sincroniza la carpeta actual con el contenedor para no tener que reconstruir 
    # la imagen cada vez que se edite una línea de código en Python.
    volumes:
      - .:/app
      - bunker_backups:/app/backups
    # 127.0.0.1, no 0.0.0.0: `tailscale serve` proxea desde http://127.0.0.1:8009 (verificado
    # con `tailscale serve status`), asi que el telefono sigue llegando y la LAN deja de
    # llegar. Eso cierra de una linea el vector LAN de los 50 endpoints de escritura, los 23
    # GET y /admin/, sin tocar ni un permission_class. Lo que queda expuesto es el tailnet,
    # que son sus propios dispositivos.
    # El APK postea a https://alonso-inspiron-5570.tail834684.ts.net (build.gradle.kts:20-21)
    # y la TUI a BUNKER_API_URL=http://localhost:8009. Ninguno usa la IP de LAN.
    ports:
      - "127.0.0.1:8009:8000"
    depends_on:
      db:
        condition: service_healthy
    # Los tres scrapers esperan a que esto pase antes de arrancar: sin healthcheck solo
    # esperaban a que el contenedor existiera, barrian 5 s despues contra un Django que aun
    # no respondia, y se quedaban dormidos 12 h hasta el siguiente ciclo.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # Las claves de API (TMDB, OMDB, Discogs, Last.fm) y el token de backup viven en .env;
    # sin esto los oraculos dentro de Django resuelven a "" y caen a su rama mock.
    env_file:
      - .env
    environment:
      - POSTGRES_DB=library_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?falta en .env}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      # Sin esto el contenedor corre en UTC y el cron de las 00:00 dispara a las 20:00 locales.
      - TZ=America/Santiago

# --- Microservicios Distribuidos Node.js ---
  scraper-books:
    build: ./scraper
    restart: unless-stopped
    command: npm run start:books
    volumes:
      - ./scraper:/app
      - /app/node_modules
      - ./scraper_logs:/app/logs
    depends_on:
      web:
        condition: service_healthy

  scraper-movies:
    build: ./scraper
    restart: unless-stopped
    command: npm run start:movies
    # Sin env_file a proposito. El comentario que habia aqui decia "Pasa la clave
    # TMDB_API_KEY" y era falso: ningun fichero del scraper lee TMDB_API_KEY (grep
    # process.env en scraper/ = 4 coincidencias, ninguna es esa). Lo unico que lee este
    # servicio es PUPPETEER_EXECUTABLE_PATH, que no esta en .env y cae a null.
    # Montar .env entero aqui metia POSTGRES_PASSWORD y DJANGO_SECRET_KEY en un contenedor
    # de Node que no las usa.
    volumes:
      - ./scraper:/app
      - /app/node_modules
      - ./scraper_logs:/app/logs
    depends_on:
      web:
        condition: service_healthy

  scraper-music:
    build: ./scraper
    restart: unless-stopped
    command: npm run start:music
    # Solo la clave que de verdad lee (scraper/strategies/music/discogs.js:7); sin ella la
    # estrategia de Discogs se omite entera. Antes esto era `env_file: .env`, que ademas le
    # entregaba POSTGRES_PASSWORD y DJANGO_SECRET_KEY sin que las necesite.
    environment:
      - DISCOGS_API_KEY=${DISCOGS_API_KEY:-}
    volumes:
      - ./scraper:/app
      - /app/node_modules
      - ./scraper_logs:/app/logs
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
    name: library_manager_postgres_data
  bunker_backups:
    name: bunker_backups_data